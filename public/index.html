<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medical Terminology Explorer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Medical Terminology Explorer</h1>
      <p class="sub">Live data from <code>medterms.hku.hk</code> (Base64-decoded in your browser)</p>
      <nav class="nav">
        <button id="modeBrowser" class="navbtn active">Browse</button>
        <button id="modeTest" class="navbtn">Practice Test</button>
        <button id="modeDuo" class="navbtn">Duolingo</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="browserView">
      <section id="wodSection" class="wod" hidden></section>
      <section class="toolbar">
        <input id="search" type="search" placeholder="Search term, meaning, root, prefix…" autocomplete="off" />
        <select id="levelFilter"><option value="">All levels</option></select>
        <select id="catFilter"><option value="">All categories</option></select>
        <button id="showWodBtn" class="btn secondary" hidden>Show Word of the Day</button>
        <span id="count" class="count"></span>
      </section>

      <section id="status" class="status">Loading terminology list…</section>

      <section id="grid" class="grid" hidden></section>
    </section>

    <section id="testView" hidden>
      <div class="testhead">
        <h2>Practice Test</h2>
        <button id="genTest" class="btn">Generate New Test</button>
        <button id="checkTest" class="btn">Check Answers</button>
        <button id="reviewSessionsBtn" class="btn secondary">Review Sessions</button>
        <span id="timer" class="count"></span>
        <span id="score" class="count"></span>
      </div>
      <div id="sessionsPanel" class="sessions hidden"></div>
      <div id="testBody" class="testbody"></div>
    </section>

    <section id="duoView" hidden>
      <div class="duohead">
        <h2>Duolingo Mode</h2>
        <div class="duostats">
          <span id="duoScore" class="count"></span>
          <span id="duoStreak" class="count"></span>
        </div>
      </div>
      <div id="duoMenu" class="duomenu"></div>
      <div id="duoArea" class="duoarea"></div>
    </section>
  </main>

  <dialog id="detail">
    <button id="closeDetail" class="close" aria-label="Close">×</button>
    <div id="detailBody"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
