[package]
name = "medical-terminology-explorer"
version = "1.0.0"
description = "Medical Terminology Explorer"
authors = ["Ricky"]
edition = "2021"

[lib]
name = "medical_terminology_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
