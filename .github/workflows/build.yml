name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/**

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install generic Android debug keystore
        run: |
          mkdir -p ~/.android
          cp android-keystore.jks ~/.android/debug.keystore
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/*.apk medical-terminology-explorer_v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: medical-terminology-explorer_v1.0.0.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build iOS archive
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build archive
      - name: Package IPA
        working-directory: ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r App.ipa Payload
      - name: Rename IPA
        working-directory: ios/App
        run: mv App.ipa medical-terminology-explorer_v1.0.0.ipa
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/medical-terminology-explorer_v1.0.0.ipa



  tauri:
    name: Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri
        run: npm run tauri:build
        shell: bash
      - name: Standardize artifact names
        shell: bash
        run: |
          set -e
          find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) -print0 | while IFS= read -r -d '' f; do
            ext="${f##*.}"
            mv "$f" "medical-terminology-explorer_v1.0.0.${ext}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: medical-terminology-explorer_v1.0.0.*


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android, ios, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.apk
            release-assets/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
