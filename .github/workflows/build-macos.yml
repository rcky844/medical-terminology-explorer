name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true
        default: '1.0.0'

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist/**/*.dmg
  tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Tauri
        run: npm run tauri:build
      - name: Standardize artifact names
        shell: bash
        run: |
          set -e
          find src-tauri/target/release/bundle -type f -name '*.dmg' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "medical-terminology-explorer_v${{ inputs.version }}.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: medical-terminology-explorer_v${{ inputs.version }}.dmg
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build iOS archive
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build archive
      - name: Package IPA
        working-directory: ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r medical-terminology-explorer_v${{ inputs.version }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/medical-terminology-explorer_v${{ inputs.version }}.ipa
