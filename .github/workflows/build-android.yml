name: Build Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm pkg set version="$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install generic Android debug keystore
        run: |
          mkdir -p ~/.android
          cp android-keystore.jks ~/.android/debug.keystore
      - run: npx cap add android || true
      - name: Stamp version into native project
        run: npm run version:sync
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/*.apk mt-explorer-android_v${{ steps.version.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mt-explorer-android_v${{ steps.version.outputs.version }}.apk
