name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create GitHub release
        required: false
        type: boolean
        default: false

jobs:
  desktop:
    name: Desktop Full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm version "$V" --no-git-tag-version
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/*.exe

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm version "$V" --no-git-tag-version
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install generic Android debug keystore
        run: |
          mkdir -p ~/.android
          cp android-keystore.jks ~/.android/debug.keystore
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/*.apk medical-terminology-explorer_v${{ steps.version.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: medical-terminology-explorer_v${{ steps.version.outputs.version }}.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm version "$V" --no-git-tag-version
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build iOS archive
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build archive
      - name: Package IPA
        working-directory: ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r medical-terminology-explorer_v${{ steps.version.outputs.version }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/medical-terminology-explorer_v${{ steps.version.outputs.version }}.ipa

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' || inputs.create_release }}
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.apk
            release-assets/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
