name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true
        default: '1.0.0'

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/**/*.exe
