name: Build Windows

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm pkg set version="$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npm run dist
      - name: Rename desktop artifact
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          f="$(find dist -maxdepth 1 -name '*.exe' | head -n 1)"
          mv "$f" "dist/mt-explorer-windows-x64_v${V}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/mt-explorer-*.exe
