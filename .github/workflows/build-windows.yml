name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build
        required: true
        default: '1.0.0'

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/**/*.exe
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Tauri icons
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Tauri
        run: npm run tauri:build
      - name: Standardize artifact names
        shell: bash
        run: |
          set -e
          find src-tauri/target/release/bundle -type f -name '*.exe' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "medical-terminology-explorer_v${{ inputs.version }}.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: medical-terminology-explorer_v${{ inputs.version }}.exe
