name: Build iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          npm pkg set version="$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm install
      - run: npx cap add ios || true
      - run: npx cap sync ios
      - name: Build iOS archive
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build archive
      - name: Package IPA
        working-directory: ios/App
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r mt-explorer-ios_${{ steps.version.outputs.version }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/App/mt-explorer-ios_${{ steps.version.outputs.version }}.ipa
